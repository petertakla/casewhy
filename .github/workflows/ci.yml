name: CI (static site)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-jsonld:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-jsonld.mjs
