name: CI

on:
  push:
    branches: [nextjs-app]
  pull_request:
    branches: [nextjs-app]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run validate:jsonld
      - run: npm run check:language-switcher
      - run: npm run check:processing-times-age
      - run: npm run check:founder-name
      - run: npm run check:poster-env-vars
      # Round 114 follow-up (Cloud review) — real visibility, not a hard
      # gate: two pre-existing transitive dev-tooling vulnerabilities
      # (drizzle-kit's esbuild dep, postcss via next) need a deliberate,
      # tested major-version upgrade (next 16, drizzle-kit 0.18.1) to
      # clear, not a same-day forced fix days before a federal demo.
      # continue-on-error keeps this from blocking CI while findings
      # exist; Dependabot (.github/dependabot.yml) is the actual
      # remediation path, opening PRs as fixes become available.
      - run: npm audit --audit-level=high
        continue-on-error: true
      - run: npm run build
        env:
          USCIS_ENV: sandbox
          USCIS_CLIENT_ID: ${{ secrets.USCIS_CLIENT_ID }}
          USCIS_CLIENT_SECRET: ${{ secrets.USCIS_CLIENT_SECRET }}
          USCIS_FOIA_CLIENT_ID: ${{ secrets.USCIS_FOIA_CLIENT_ID }}
          USCIS_FOIA_CLIENT_SECRET: ${{ secrets.USCIS_FOIA_CLIENT_SECRET }}
          USCIS_SANDBOX_TOKEN_URL: https://api-int.uscis.gov/oauth/accesstoken
          USCIS_SANDBOX_API_BASE: https://api-int.uscis.gov
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEON_AUTH_BASE_URL: ${{ secrets.NEON_AUTH_BASE_URL }}
          NEON_AUTH_COOKIE_SECRET: ${{ secrets.NEON_AUTH_COOKIE_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          POSTMARK_API_TOKEN: ${{ secrets.POSTMARK_API_TOKEN }}
      # Round 110 follow-up — reads .next/prerender-manifest.json (which
      # page routes were statically prerendered), so it has to run after
      # `npm run build`, unlike the other check: scripts above.
      - run: npm run check:page-filters
